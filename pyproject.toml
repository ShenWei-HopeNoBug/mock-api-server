[project]
name = "mock-api-server"
version = "0.1.5"
description = "本地 mock 服务桌面工具（PySide6 + Flask + mitmproxy + MCP）"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "shenwei"}]
requires-python = ">=3.13"
dependencies = [
  "flask==3.1.3",
  "flask-cors==4.0.1",
  "mcp==2.0.0",
  "mitmproxy==12.2.3",
  "pillow==10.4.0",
  "psutil==6.1.0",
  "pyside6==6.10.3",
  "pywin32==312; sys_platform == 'win32'",
  "requests==2.32.3",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "werkzeug==3.1.3",
]

[dependency-groups]
dev = [
  "pyinstaller==6.11.1",
  "pyinstaller-hooks-contrib==2024.10",
  "pytest>=8",
  "ruff>=0.6",
  "uv==0.13.6",
]

[tool.uv]
package = false
# 传递依赖约束：二进制/平台相关包钉死到 package.txt 快照版本，
# 保证迁移后关键二进制面（Qt 运行库 / mitmproxy 引擎）与现状等价；
# 纯 Python 工具类传递依赖不约束，跟随正常解析。
# 其中 mitmproxy-rs / mitmproxy-windows 不约束会有版本漂移风险；
# PySide6 三件组钉死与直接依赖同版本，保证 Qt 二进制面确定（WebEngine 在 addons 内）
constraint-dependencies = [
  "pyside6-addons==6.10.3",
  "pyside6-essentials==6.10.3",
  "shiboken6==6.10.3",
  "mitmproxy-rs==0.12.11",
  "mitmproxy-windows==0.12.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 2
extend-exclude = [
  ".venv",
  "dist",
  "build",
  "server",
  "static",
  "web",
  "resources",
  "appServer",
  "data",
  "output",
  "system",
]

# 保守规则集：只抓真 bug 类问题；不做 ruff format（formatter 硬编码 4 空格，与项目 2 空格风格冲突）
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# win_ui.py 为 pyside6-uic 生成物（宽 import 列表属预期），不入 lint
"qt_ui/**/win_ui.py" = ["F401", "I001"]
